# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - multideck

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: multideck.client/package-lock.json

      - name: Set up npm
        run: npm install --global npm@10.9.2

      - name: Install client dependencies
        run: npm ci
        working-directory: multideck.client

      - name: Build client
        run: npm run build
        working-directory: multideck.client
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Copy client into server
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path multideck.server/wwwroot | Out-Null
          Copy-Item -Path multideck.client/dist/* -Destination multideck.server/wwwroot -Recurse -Force

      - name: Restore dependencies
        run: dotnet restore
        working-directory: multideck.server

      - name: Build with dotnet
        run: dotnet build --configuration Release --no-restore
        working-directory: multideck.server

      - name: Run server tests
        run: dotnet test multideck.server.tests/multideck.server.tests.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish --configuration Release --no-build --output "${{ env.DOTNET_ROOT }}/myapp"
        working-directory: multideck.server

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_47002B3A036547CA8985AC1F5827C63F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0E709D96C8EE4385B81C033B027AA266 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7F539F6B90804E4CB6811E13B8645EBA }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'multideck'
          slot-name: 'Production'
          package: .
