name: Data access regression

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-access:
    name: Data access regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL for real row-level security tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl ca-certificates postgresql-common
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-17 postgresql-client-17 libpq-dev
      - name: Verify shared access and permission boundaries
        run: |
          export PG_TEST_BIN=/usr/lib/postgresql/17/bin
          # These fixtures otherwise skip when PostgreSQL is unavailable.
          # CI must fail instead of reporting a skipped security check as green.
          "$PG_TEST_BIN/initdb" --version
          "$PG_TEST_BIN/pg_ctl" --version
          "$PG_TEST_BIN/psql" --version
          node supabase/tests/run-data-access-regression.mjs
